version: "2"
run:
  timeout: 5m
  go: 1.26.4
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - cyclop
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - gosmopolitan
    - govet
    - ineffassign
    - interfacebloat
    - intrange
    - loggercheck
    - maintidx
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
    - wrapcheck
    - zerologlint
  settings:
    cyclop:
      max-complexity: 12
    exhaustruct:
      exclude:
        - github\.com/larsartmann/cqrs-htmx/identity-model/v4\.\w+Payload$
        - github\.com/larsartmann/cqrs-htmx/identity-model/v4\.EnforcerConfig$
        - github\.com/larsartmann/cqrs-htmx/identity-model/v4\.PolicyUpdate$
        - github\.com/larsartmann/cqrs-htmx/identity-model/v4\.User$
        - github\.com/larsartmann/cqrs-htmx/identity-model/v4\.ActorID$
        - github\.com/larsartmann/cqrs-htmx/identity-model/v4\.WebAuthnCredential$
        - github\.com/larsartmann/cqrs-htmx/identity-model/v4\.UserState$
        - github\.com/larsartmann/cqrs-htmx/identity-model/v4\.BotState$
        - github\.com/larsartmann/cqrs-htmx/identity-model/v4\.TenantState$
        - github\.com/larsartmann/cqrs-htmx/identity-model/v4\.MembershipState$
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
  exclusions:
    generated: lax
    rules:
      - path: errors\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
      - path: constants\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
      - path: id\.go$
        linters:
          - recvcheck
      - path: fold\.go$
        linters:
          - cyclop
          - funlen
          - gocognit
      - path: _test\.go
        linters:
          - wrapcheck
          - exhaustruct
          - goconst
          - paralleltest
          - unparam
          - cyclop
          - funlen
          - noctx
    paths:
      - \.gen\.go$
      - _mock\.go$
      - _templ\.go$
