# BuildFlow Configuration
# See: https://github.com/larsartmann/buildflow

# Build mode: full, fast, ci, dev, pre-commit
build_mode: full

# Parallel execution
# Kept at 2 as defense-in-depth. The primary fix for the govalid-generate flake
# is the GOCACHE pre-warming script (scripts/prewarm-gocache.sh) called from the
# pre-commit hook. Pre-warming compiles all shared dependencies once (serialized)
# before concurrent tools start, converting GOCACHE access from WRITE (race-prone)
# to READ (safe). With pre-warming in place, max_concurrency could safely return
# to 4, but 2 is kept as a safety margin until post-fix failure rate is verified
# at 0% over a sufficient sample.
parallel: true
max_concurrency: 2

# Retry modifier: conservative retries transiently-failing steps with backoff.
# With the GOCACHE pre-warming fix, govalid-generate failures should drop to ~0%.
# Retries remain as a safety net for any residual transient failures.
# Valid values: aggressive, conservative, none. (The --retry-profile flag sets
# this same key.)
retry_modifier: conservative

# File settings
max_file_size: 350 # lines
dupl_threshold: 30 # tokens

# Comment severity for action items found in code: debug, info, warn, error
# Set to debug so documentation notes don't block commits.
todo_severity: debug

# Patterns to exclude from checks
exclude:
  - vendor
  - .git
  - node_modules
  - .next
  - dist
  - "*.pb.go"
  - "*.gen.go"

# Auto-fix settings
auto_fix: false

# Logging
verbose: false
log_level: info
