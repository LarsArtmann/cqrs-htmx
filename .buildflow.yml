# BuildFlow Configuration
# See: https://github.com/larsartmann/buildflow

# max_concurrency: 1 is the DEFINITIVE fix for the govalid-generate GOCACHE
# race. At concurrency >1, two govalid (or golangci-lint) processes can
# SIMULTANEOUSLY compile the same cold-cache dependency (encoding/json/v2 under
# GOEXPERIMENT=jsonv2 is not pre-compiled) to GOCACHE, racing on concurrent
# WRITEs. At concurrency 1 there is only ever ONE writer, so the race is
# impossible. The speed cost is negligible (~5% on a warm cache) because the
# bottleneck is per-module compile time, not parallelism.
# scripts/prewarm-gocache.sh remains a PERFORMANCE optimization and is still
# called from the pre-commit hook; it is no longer load-bearing for correctness.
max_concurrency: 1

# Conservative retries transiently-failing steps with backoff. With
# max_concurrency: 1 the GOCACHE race is eliminated at the source, so failures
# should be ~0%. Retries remain a safety net for other transient failures.
retry_modifier: conservative

# Only FIXME/XXX/BUG-class markers fail; TODO/NOTE/OPTIMIZE do not block
# commits (documentation notes).
todo_min_severity: warning

# Shell scripts are owned by treefmt (`nix fmt`: shfmt 2-space indent +
# shellcheck). BuildFlow's own shfmt would fight that on every staged script;
# script linting is enforced by treefmt + CI. HTML/min.js are generated or
# vendored artifacts that must not be reformatted.
exclude:
  - "*.html"
  - "*.min.js"
  - "*.sh"

# Skip templ-generate: BuildFlow's bundled templ binary regenerates _templ.go
# files with directory-prefixed FileName: fields, conflicting with the
# nix-pinned templ version. Committed files are verified by `nix run
# .#check-codegen` instead.
# jest/vitest/pnpm-audit: Go library, no JS test framework or lockfile.
# deadnix: not installed. eslint: biome handles JS formatting/linting.
# dprint-format: dprint.json here scopes dprint to markdown only; markdown
# formatting waits for a one-time normalization pass (257 files).
skip_steps:
  - templ-generate
  - jest-test
  - vitest-test
  - pnpm-audit
  - deadnix
  - dprint-format
