# BuildFlow Configuration
# See: https://github.com/larsartmann/buildflow

# Build mode: full, fast, ci, dev, pre-commit
build_mode: full

# Parallel execution
# Reduced from 4 to 2 because govalid-generate (go/packages loader) intermittently
# fails to resolve sibling modules under higher concurrency, producing cascading
# "undefined: command" / "markers: failed prerequisites" errors that disappear on
# re-run. This is a known transient flake in this workspace, not a code bug.
parallel: true
max_concurrency: 2

# Retry modifier: conservative retries transiently-failing steps with backoff.
# This auto-recovers the known govalid-generate flake (go/packages loader race
# documented above) instead of hard-failing and requiring a manual re-run.
# Valid values: aggressive, conservative, none. conservative avoids masking real
# failures the way aggressive might. (The --retry-profile flag sets this same key.)
retry_modifier: conservative

# File settings
max_file_size: 350 # lines
dupl_threshold: 30 # tokens

# Comment severity for action items found in code: debug, info, warn, error
# Set to debug so documentation notes don't block commits.
todo_severity: debug

# Patterns to exclude from checks
exclude:
  - vendor
  - .git
  - node_modules
  - .next
  - dist
  - "*.pb.go"
  - "*.gen.go"

# Auto-fix settings
auto_fix: false

# Logging
verbose: false
log_level: info
