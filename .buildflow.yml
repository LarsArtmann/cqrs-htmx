# BuildFlow Configuration
# See: https://github.com/larsartmann/buildflow

# max_concurrency: 1 is the DEFINITIVE fix for the govalid-generate GOCACHE
# race. At concurrency >1, two govalid (or golangci-lint) processes can
# SIMULTANEOUSLY compile the same cold-cache dependency (encoding/json/v2 under
# GOEXPERIMENT=jsonv2 is not pre-compiled) to GOCACHE, racing on concurrent
# WRITEs. At concurrency 1 there is only ever ONE writer, so the race is
# impossible. The speed cost is negligible (~5% on a warm cache) because the
# bottleneck is per-module compile time, not parallelism.
# scripts/tools/prewarm-gocache.sh remains a PERFORMANCE optimization and is still
# called from the pre-commit hook; it is no longer load-bearing for correctness.
max_concurrency: 1

# Conservative retries transiently-failing steps with backoff. With
# max_concurrency: 1 the GOCACHE race is eliminated at the source, so failures
# should be ~0%. Retries remain a safety net for other transient failures.
retry_modifier: conservative

# Only FIXME/XXX/BUG-class markers fail; TODO/NOTE/OPTIMIZE do not block
# commits (documentation notes).
todo_min_severity: warning

# Shell scripts are owned by treefmt (`nix fmt`: shfmt 2-space indent +
# shellcheck). BuildFlow's own shfmt would fight that on every staged script;
# script linting is enforced by treefmt + CI. HTML/min.js are generated or
# vendored artifacts that must not be reformatted.
#
# A user `exclude:` list ADDS to BuildFlow's built-in defaults (merge
# semantics since BuildFlow b27f4f05b, 2026-09-30, verified in the installed
# binary) — vendor/testdata/*_templ.go/lock files stay protected without
# restating them.
exclude:
  - "*.html"
  - "*.min.js"
  - "*.sh"
  # Committed Tailwind bundles + buildflow's orphan styles.css outputs are
  # NEVER buildflow's business: the canonical minified bundles are built by
  # the flake apps (nix run .#build-adminui-css / .#build-dashboardui-css)
  # and verified by check-css-bundles (+ class-set gate). The 2026-09-23
  # incident (commit 1b3c0cf9) had buildflow's tailwind step rewrite the
  # bundles without --minify — these patterns make that impossible for any
  # css-touching step, current or future.
  - "*-tw.css"
  - "styles.css"

# Skip templ-generate: BuildFlow's bundled templ binary regenerates _templ.go
# files with directory-prefixed FileName: fields, conflicting with the
# nix-pinned templ version. Committed files are verified by `nix run
# .#check-codegen` instead.
# jest/vitest/pnpm-audit: Go library, no JS test framework or lockfile.
# deadnix: not installed. eslint: biome handles JS formatting/linting.
# dprint-format: dprint.json here scopes dprint to markdown only; markdown
# formatting waits for a one-time normalization pass (257 files).
#
# go-version-auto-configure: DESTRUCTIVE here — SKIPPED 2026-09-20 after it
# corrupted the tree in commit 27057e5c. Two independent failures, both
# confirmed by reading the vendored SDK (go-version-auto-configure):
#   1. Its policy is hardcoded to major.minor go directives, so it rewrote this
#      repo's DELIBERATE `go 1.27.1` floor to `go 1.27` in go.work + 4 module
#      go.mods (24 modules agree on 1.27.1 — see the AGENTS.md toolchain row;
#      the patch floor is a repo decision, not drift).
#   2. Its fixer runs `go mod tidy` after every `go mod edit` (pkg/fix
#      ensureTidyStable). The verify-tag fixtures under scripts/testdata/ are
#      go.mod-only modules (no .go files), so tidy deleted EVERY require line,
#      silently disabling scripts/selftests/test-verify-tag.sh's 12-case guard (it then
#      passed; the rejects had nothing left to reject). The SDK walker skips
#      only vendor/node_modules/.git/result — NOT testdata, unlike BuildFlow's
#      own DefaultExcludePatterns.
# Re-enable only when BOTH are fixed upstream: testdata (and other fixture
# trees) pruned from the walk, AND either a policy knob or repo alignment to
# major.minor go directives. See the AGENTS.md gotcha + TODO_LIST item.
# tailwind-build: skipped — its only output here is the gitignored orphan
# adminui/styles.css + dashboardui/styles.css (never served, never consumed —
# AGENTS gotcha 9), and the step class was the 2026-09-23 pretty-bundle
# producer (TODO P2). Canonical minified bundles come from the flake apps
# (nix run .#build-adminui-css / .#build-dashboardui-css) and are gated by
# scripts/checks/check-css-bundles.sh. Re-enable only if a buildflow-native build
# can target per-module outputs with --minify AND honor the exclude list.
# license-check: skipped 2026-10-05 — permanently unpassable by design, not a
# health signal. go-licenses only recognizes KNOWN OPEN SOURCE licenses, and
# this repo's dependency graph is dominated by PROPRIETARY LarsArtmann
# modules (go-cqrs-lite/*, templ-components, httputil, go-sse, ...) relicensed
# 2026-09-25; additionally go-licenses #128 rejects stdlib packages ("does not
# have module info"). Every module's license-check therefore fails on the same
# E1005/F1001 class regardless of tree health (verified: all 29 module steps
# red with identical errors on a fully-green tree, 2026-10-05). Licensing is
# enforced by the repos' own LICENSE files + license-sync, not by go-licenses.
skip_steps:
  - templ-generate
  - tailwind-build
  - jest-test
  - vitest-test
  - pnpm-audit
  - deadnix
  - dprint-format
  - go-version-auto-configure
  - license-check

# fail_on: critical — findings gate RESTORED (2026-09-18, task M8 verification).
# History: demoted 2026-09-17 (task M3) because the gate was always-red on
# pre-existing findings. TWO root causes were found and fixed 2026-09-18:
#   1. The suppression config was authored as `.go-structure-linter.yml` but
#      the linter auto-discovers `.go-structure-linter.yaml` — the file was
#      NEVER read by any session. Renamed; suppressions now apply.
#   2. The buildflow binary was stale (built at 42fd89b, repo at 7d3d967).
#      Rebuilt from BuildFlow HEAD into ~/go/bin (shadows the nix profile;
#      ~/go/bin precedes ~/.nix-profile/bin on PATH). The old binary's rule
#      set flagged root-package-files ×50; the current one does not.
#   Additionally the gomod-checker vendor-consistency ×25 resolved naturally
#   (examples/middleware-showcase/vendor/ was trashed).
# Suppressions that keep the gate honest live in .go-structure-linter.yaml
# (root-package-files, go-version, go-sum fixture ID) — each with a reason
# and, for go-version, an explicit removal condition (TODO_LIST P2 toolchain
# decision). CAVEAT: a go-structure-linter build from the v0.10.0 TAG does
# not carry the suppression feature; machines running only tagged builds
# would see the raw findings. Current verification: 5 findings (2 warnings
# + 3 infos, 0 errors) with BUILDFLOW_NO_RESULT_CACHE=1.
# GOTCHA: buildflow's result cache keys on matched FILES — config/binary
# changes do NOT invalidate it; use BUILDFLOW_NO_RESULT_CACHE=1 when a
# finding replays after its cause was fixed.
fail_on: critical
