version: "2"
run:
  timeout: 5m
  go: 1.27.2
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - bodyclose
    - copyloopvar
    - cyclop
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - forcetypeassert
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - gosmopolitan
    - govet
    - ineffassign
    - interfacebloat
    - intrange
    - loggercheck
    - maintidx
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
    - wrapcheck
    - zerologlint
  disable:
    # The adapter re-exports nothing, but it does declare the package-level
    # `validationCode` constant and Huma's option closures — globals are not the
    # concern datastar's re-export shims made them.
    - gochecknoglobals
    # depguard denies encoding/json/v2; the adapter does not encode JSON itself.
    - depguard
    # Huma wraps handler calls in its own context plumbing.
    - contextcheck
  settings:
    wrapcheck:
      ignore-sigs:
        - .WithCause(
        - .WithContext(
        - .WithContextAny(
      # The adapter never re-wraps a pipeline error: a wrap replaces the outer
      # code and shadows the errorfamily context map, which is exactly what the
      # RFC 9457 body and the classified log record read.
      ignore-package-globs:
        - github.com/larsartmann/go-error-family*
        - github.com/larsartmann/go-cqrs-lite/*
        - github.com/larsartmann/cqrs-htmx/*
    cyclop:
      max-complexity: 12
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
    exhaustruct_v5:
      ignore-patterns:
        - github\.com/larsartmann/cqrs-htmx/v4\..*$
        - github\.com/danielgtaylor/huma/v2\..*$
        - github\.com/larsartmann/go-cqrs-lite/(command|query)/v4\..*$
    testifylint:
      disable:
        - go-require
      enable-all: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - wrapcheck
          - goconst
          - paralleltest
          - unparam
          - cyclop
          - funlen
          - noctx
          - errchkjson
          - nilnil
          - errcheck
          - forcetypeassert
          - exhaustruct_v5
    paths:
      - \.gen\.go$
      - _mock\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _mock\.go$
      - vendor/
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
