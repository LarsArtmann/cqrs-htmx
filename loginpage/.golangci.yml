version: "2"
run:
  timeout: 5m
  go: 1.26.4
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - bodyclose
    - copyloopvar
    - cyclop
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - gosmopolitan
    - govet
    - ineffassign
    - interfacebloat
    - intrange
    - loggercheck
    - maintidx
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
    - wrapcheck
    - zerologlint
  disable:
    # templ render chains (component.Render(ctx, w)) confuse contextcheck; we
    # always thread r.Context() via ServeHTTP.
    - contextcheck
    # depguard denies encoding/json/v2 — loginpage uses encoding/json.
    # Including depguard would be fine, but we skip it for parity with adminui.
    - depguard
  settings:
    cyclop:
      max-complexity: 12
    exhaustruct:
      exclude:
        - github\.com/larsartmann/cqrs-htmx/loginpage/v4\.PageData$
        - github\.com/larsartmann/cqrs-htmx/loginpage/v4\.Config$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.ServiceConfig$
        - net/http\.Cookie$
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
    testifylint:
      disable:
        - go-require
      enable-all: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - wrapcheck
      - path: _test\.go
        linters:
          - exhaustruct
      - path: _test\.go
        linters:
          - goconst
      - path: _test\.go
        linters:
          - paralleltest
      - path: _test\.go
        linters:
          - unparam
      - path: _test\.go
        linters:
          - cyclop
      - path: _test\.go
        linters:
          - funlen
      - path: _test\.go
        linters:
          - noctx
    paths:
      - \.gen\.go$
      - _mock\.go$
      - _templ\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _mock\.go$
      - _templ\.go$
      - vendor/
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
