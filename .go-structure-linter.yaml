# go-structure-linter suppressions for cqrs-htmx (triaged 2026-09-17, task M3;
# updated 2026-10-14 RS4). This is a multi-module LIBRARY repo: the root
# module's public API lives at the module root BY DESIGN - the import path
# github.com/larsartmann/cqrs-htmx/v4 IS the repo root. The root-package-files
# suppression was RETIRED 2026-10-14: gsl v0.11.5's published-library
# auto-deferral covers the flat root (verified live: removing the suppression
# leaves the finding silent). Remaining entries are policy-class dispositions.
suppressions:
  - rule: assets-directory
    reason: >
      adminui/assets/* are the admin UI's colocated build artifacts served by
      the admin module itself; a repo-root assets/ would separate them from
      their only consumer.
  - rule: testdata-directory
    reason: >
      Fixture placement is owner policy per module; the application-repo
      default shape does not fit this library layout.

  - id: go-structure-linter:go-sum-out-of-sync:scripts/testdata/verify-tag/clean-go-mod/go.mod:0:0:4f98394c
    reason: >
      Test fixture for verify-tag's clean-go.mod detection (scripts/testdata) -
      a synthetic minimal go.mod with no go.sum is the fixture's whole point.
  - rule: go-version
    reason: >
      Repo toolchain is deliberately pinned by flake.nix (pkgs.go_1_27) and
      go.work (1.27.1) since the 2026-09-20 bump; scripts/checks/
      check-go-toolchain.sh and the flake OWN this policy and gate it. The
      rule's "newer Go available" suggestion is a coordinated
      flake+go.work+all-modules decision (TODO_LIST P2 class), never a
      per-go.mod edit. Kept as a tripwire: if the rule fires again after a Go
      release, the decision belongs to the coordinated-bump task, not this
      config.
  - id: go-structure-linter:assets-directory:assets/:0:0:659f6c84
    reason: >
      Multi-module library repo: static assets are per-module and embedded at
      compile time (adminui/assets/admin-tw.css + admin.js via //go:embed;
      dashboardui likewise). A root-level assets/ directory would serve no
      module and imply an application layout this repo does not have.
      Triaged 2026-10-07.
  - id: go-structure-linter:internal-directory:internal/:0:0:7fa5a48e
    reason: >
      Published library — every module is a public import path
      (github.com/larsartmann/cqrs-htmx/<module>/v4); moving non-public code
      under internal/ would break consumer imports. Non-public code is already
      expressed by unexported identifiers inside the modules. Triaged
      2026-10-07.
  - id: go-structure-linter:testdata-directory:usermgmt/oauth2_stub_test.go:0:0:514ddd44
    reason: >
      In-package test stub (testOAuth2Provider) compiled into the test binary
      and consumed by service tests. testdata/ is ignored by the go toolchain,
      so relocating the file would break the build; the rule's filename
      heuristic misreads "_stub_test.go" as a fixture. Triaged 2026-10-07.
  - id: go-structure-linter:testdata-directory:usermgmt/totp_stub_test.go:0:0:1da9c303
    reason: >
      In-package test stub (same class as oauth2_stub_test.go): compiled test
      helper, not a fixture; testdata/ relocation would break compilation.
      Triaged 2026-10-07.
  - id: go-structure-linter:testdata-directory:usermgmt/webauthn_stub_test.go:0:0:bbacaf75
    reason: >
      In-package test stub (same class as oauth2_stub_test.go): compiled test
      helper, not a fixture; testdata/ relocation would break compilation.
      Triaged 2026-10-07.
