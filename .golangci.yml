version: "2"
run:
  timeout: 5m
  go: 1.26.4
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  settings:
    cyclop:
      max-complexity: 12
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - $module
            # Self-import (test files reference the root package by full path;
            # depguard v2's $module token doesn't match the bare module path).
            - github.com/larsartmann/cqrs-htmx
            # go-cqrs-lite family — the CQRS/event-sourcing foundation this library wires to net/http.
            - github.com/larsartmann/go-cqrs-lite
            # Sibling LarsArtmann libraries: classified errors and branded (typed) IDs.
            - github.com/larsartmann/go-error-family
            - github.com/larsartmann/go-branded-id
            - github.com/larsartmann/httputil
            # First-party runtime dependencies of the root module.
            - github.com/casbin/casbin/v3
            - github.com/justinas/nosurf
            - github.com/oklog/ulid
            - github.com/go-playground/form/v4
            # BDD test stack (onsi). Test-only but depguard evaluates tests too.
            - github.com/onsi/ginkgo/v2
            - github.com/onsi/gomega
            - golang.org/x
    exhaustruct:
      exclude:
        - os/exec.Cmd
        - github\.com/larsartmann/cqrs-htmx/v4\.(Config|handlerConfig|RateLimiterConfig|CSRFConfig|SecurityHeadersConfig)$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.(User|UserState|UserReadModel|UserView|EnforcerConfig|HandlerConfig|ActorID|AccountLockout|InMemorySessionStore|WebAuthnCredential)$
        - .+\.testCreateUserCmd$
        - .+\.bddCreateUserCmd$
        - .+\.fakeSpan$
        - .+\.fakeTracer$
        - .+\.cidCapture$
        - .+\.SSEEvent$
        - .+\.CommandAck$
        - .+\.JournalSSEStore$
        - .+\.sseReadResult$
        - .+\.lockedRecorder$
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-local: true
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      always: true
    revive:
      rules:
        - name: exported
        - disabled: true
          name: package-comments
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
      ignore-type-assert-ok: true
  exclusions:
    generated: lax
    rules:
      - path: (errors|htmx_embed|notify|app|logging|csrf_middleware)\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
      - path: _test\.go
        text: dot-imports
        linters:
          - revive
      - path: app_test\.go$
        linters:
          - gochecknoglobals
      - path: webauthn_stub_test\.go$
        linters:
          - gochecknoglobals
      - path: _test\.go
        linters:
          - wrapcheck
      - path: (benchmark|example|_test|sse_reconnect_integration)_test?\.go$|^example.*_test\.go$|_test\.go$
        linters:
          - intrange
          - noctx
          - nilnil
          - goconst
          - funlen
          - paralleltest
          - err113
      - path: _test\.go
        text: unused
        linters:
          - unused
      - path: benchmark_server_test\.go$
        linters:
          - exhaustruct
          - errcheck
    paths:
      - \.gen\.go$
      - _mock\.go$
      - _templ\.go$
      - adminui/
      - loginpage/
      - usermgmt/
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _mock\.go$
      - _templ\.go$
      - adminui/
      - usermgmt/
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
