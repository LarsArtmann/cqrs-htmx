version: "2"
run:
  timeout: 5m
  go: 1.26.4
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - cyclop
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - gosmopolitan
    - govet
    - ineffassign
    - interfacebloat
    - intrange
    - loggercheck
    - maintidx
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
    - wrapcheck
    - zerologlint
  settings:
    cyclop:
      max-complexity: 12
    exhaustruct:
      exclude:
        - os/exec.Cmd
        - github\.com/larsartmann/cqrs-htmx/v3\.(Config|handlerConfig|RateLimiterConfig|CSRFConfig|SecurityHeadersConfig)$
        - .+\.testCreateUserCmd$
        - .+\.bddCreateUserCmd$
        - .+\.fakeSpan$
        - .+\.fakeTracer$
        - .+\.cidCapture$
        - .+\.SSEEvent$
        - .+\.lockedRecorder$
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
    testifylint:
      disable:
        - go-require
      enable-all: true
  exclusions:
    generated: lax
    rules:
      - path: (errors|htmx_embed|notify|app|logging|csrf_middleware)\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
      - path: _test\.go
        text: dot-imports
        linters:
          - revive
      - path: app_test\.go$
        linters:
          - gochecknoglobals
      - path: _test\.go
        linters:
          - wrapcheck
      - path: (benchmark|example|_test|sse_reconnect_integration)_test?\.go$|^example.*_test\.go$|_test\.go$
        linters:
          - intrange
          - noctx
          - nilnil
          - goconst
          - funlen
      - path: _test\.go
        text: unused
        linters:
          - unused
      - path: benchmark_server_test\.go$
        linters:
          - exhaustruct
          - errcheck
    paths:
      - \.gen\.go$
      - _mock\.go$
      - _templ\.go$
      - adminui/
      - usermgmt/
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _mock\.go$
      - _templ\.go$
      - adminui/
      - usermgmt/
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
