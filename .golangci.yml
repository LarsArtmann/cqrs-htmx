version: "2"
run:
  timeout: 5m
  go: 1.26.4
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    # canonicalheader disabled: every custom header in this HTMX library follows
    # the HTMX spec casing (HX-Request, HX-Redirect, …). Go's http.Header
    # auto-canonicalizes on Get/Set so the spec-form literals are functionally
    # correct and match the HTMX documentation consumers grep for.
    # - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    # testpackage disabled: this library intentionally white-box-tests unexported
    # internals (e.g. app.applyServerTiming, sse.seekable, cfg.cookieName).
    # Moving those suites to _test packages would break compilation.
    # - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  settings:
    cyclop:
      max-complexity: 12
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - $module
            # Self-import (test files reference the root package by full path;
            # depguard v2's $module token doesn't match the bare module path).
            - github.com/larsartmann/cqrs-htmx
            # go-cqrs-lite family — the CQRS/event-sourcing foundation this library wires to net/http.
            - github.com/larsartmann/go-cqrs-lite
            # Sibling LarsArtmann libraries: classified errors and branded (typed) IDs.
            - github.com/larsartmann/go-error-family
            - github.com/larsartmann/go-branded-id
            # SSE transport library (fan-out, stream lifecycle, event wire format).
            - github.com/larsartmann/go-sse
            - github.com/larsartmann/httputil
            # First-party runtime dependencies of the root module.
            - github.com/casbin/casbin/v3
            - github.com/justinas/nosurf
            - github.com/oklog/ulid
            - github.com/go-playground/form/v4
            # BDD test stack (onsi). Test-only but depguard evaluates tests too.
            - github.com/onsi/ginkgo/v2
            - github.com/onsi/gomega
            - golang.org/x
    exhaustruct:
      exclude:
        - os/exec.Cmd
        - github\.com/larsartmann/cqrs-htmx/v4\.(Config|handlerConfig|RateLimiterConfig|CSRFConfig|SecurityHeadersConfig|EventCatalog|EventMetadata|PayloadField|ProjectionStatusEntry)$
        - github\.com/larsartmann/cqrs-htmx/v4/openapi\..*$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.(User|UserState|UserReadModel|UserView|EnforcerConfig|HandlerConfig|ActorID|AccountLockout|InMemorySessionStore|WebAuthnCredential)$
        - .+\.testCreateUserCmd$
        - .+\.bddCreateUserCmd$
        - .+\.fakeSpan$
        - .+\.fakeTracer$
        - .+\.cidCapture$
        - .+\.SSEEvent$
        - .+\.stubCarrierError$
        - .+\.CommandAck$
        - .+\.JournalSSEStore$
        - .+\.sseReadResult$
        - .+\.lockedRecorder$
        # sse.Event has optional ID/Retry/Event/Data fields; partial init (zero-value = unset) is intended.
        - github\.com/larsartmann/go-sse\.Event$
        # dashboardui structs mirror root's optional-config / internal-init pattern.
        - github\.com/larsartmann/cqrs-htmx/dashboardui/v4\.(Config|Dashboard|overviewStats|navItem)$
        # External structs with optional/zero-value-default fields where partial init is intended.
        - net/http\.Request$
        - .+\.ListOptions$
        - .+\.StreamRef$
        - .+\.StatCardProps$
        # Test fixtures with intentionally partial fields.
        - .+\.fakeSerializer$
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-local: true
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      # always: false reports only make([]T, 0) without capacity (the true anti-pattern);
      # pre-allocated slices with known length or capacity are legitimate and left alone.
      always: false
    revive:
      rules:
        - name: exported
        - disabled: true
          name: package-comments
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
        # Idiomatic Go short names for HTTP handlers and concurrency primitives.
        # w/r are the universal net/http handler convention; ch/wg/mu are channel/WaitGroup/mutex.
        - w
        - r
        - ch
        - wg
        - mu
        - mw
        - rw
        - ws
      ignore-type-assert-ok: true
  exclusions:
    generated: lax
    rules:
      - path: (errors|htmx_embed|notify|app|logging|csrf_middleware)\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
      - path: _test\.go
        text: dot-imports
        linters:
          - revive
      - path: app_test\.go$
        linters:
          - gochecknoglobals
      - path: webauthn_stub_test\.go$
        linters:
          - gochecknoglobals
      - path: _test\.go
        linters:
          - wrapcheck
      - path: (benchmark|example|_test|sse_reconnect_integration)_test?\.go$|^example.*_test\.go$|_test\.go$
        linters:
          - intrange
          - noctx
          - nilnil
          - goconst
          - funlen
          - paralleltest
          - err113
          # varnamelen: test fixtures legitimately use short names (w, r, bc, st);
          # signal is low in tests and the idiomatic names are already ignored above.
          - varnamelen
          # ireturn: test factories/stubs legitimately return interfaces (Enforcer,
          # command.Command) to inject into the system under test.
          - ireturn
      - path: _test\.go
        text: unused
        linters:
          - unused
      - path: benchmark_server_test\.go$
        linters:
          - exhaustruct
          - errcheck
    paths:
      - \.gen\.go$
      - _mock\.go$
      - _templ\.go$
      - adminui/
      - loginpage/
      - usermgmt/
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _mock\.go$
      - _templ\.go$
      - adminui/
      - usermgmt/
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
