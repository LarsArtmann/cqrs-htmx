version: "2"
run:
  timeout: 5m
  go: 1.26.5
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  disable:
    - depguard
  settings:
    cyclop:
      max-complexity: 12
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (*sql.DB).Close
        - (*sql.Rows).Close
        - (*sql.Stmt).Close
        - (net.Conn).Close
        - (*net.TCPConn).Close
        - (*net.UDPConn).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - (*strings.Builder).WriteString
        - (*bytes.Buffer).WriteString
    exhaustruct:
      exclude:
        - os/exec.Cmd
        - github\.com/larsartmann/cqrs-htmx/v4\.(Config|handlerConfig|RateLimiterConfig|CSRFConfig|SecurityHeadersConfig|EventCatalog|EventMetadata|PayloadField|ProjectionStatusEntry)$
        - github\.com/larsartmann/httputil\.(CSRFConfig|KeyedRateLimiterConfig)$
        - github\.com/larsartmann/cqrs-htmx/v4/openapi\..*$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.(User|UserState|UserReadModel|UserView|EnforcerConfig|HandlerConfig|ActorID|AccountLockout|InMemorySessionStore|WebAuthnCredential)$
        - .+\.testCreateUserCmd$
        - .+\.bddCreateUserCmd$
        - .+\.fakeSpan$
        - .+\.fakeTracer$
        - .+\.cidCapture$
        - .+\.SSEEvent$
        - .+\.stubCarrierError$
        - .+\.(fakeSeekableJournal|fakeEventByIDLoader)$
        - github\.com/larsartmann/go-cqrs-lite/projectionhost/v4\.DeadLetterEntry$
        - .+\.CommandAck$
        - .+\.JournalSSEStore$
        - .+\.sseReadResult$
        - .+\.lockedRecorder$
        - github\.com/larsartmann/go-sse\.Event$
        - github\.com/larsartmann/cqrs-htmx/dashboardui/v4\.(Config|Dashboard|overviewStats|navItem|sortState|fakeCommandJournal|fakeQueryJournal|fakeEventSource|fakeSnapshotStore)$
        - github\.com/larsartmann/cqrs-htmx/dashboardui/v4/core\.(PageState|EventFilter|Overview|RecentEvent|ProjectionStat)$
        - net/http\.Request$
        - .+\.ListOptions$
        - .+\.StreamRef$
        - .+\.StatCardProps$
        - .+\.fakeSerializer$
    funlen:
      lines: 200
      statements: 100
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-local: true
    gosec:
      # G705 (XSS via taint analysis) is structurally a false positive in a
      # response-writing library: every ResponseWriter.Write emits intentional
      # output, never unsanitized HTML rendering.
      excludes:
        - G304
        - G115
        - G705
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      always: false
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "100"
    revive:
      rules:
        - name: exported
        - disabled: true
          name: package-comments
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - fn
        - t
        - i
        - j
        - m
        - g
        - a
        - b
        - v
        - w
        - r
        - ch
        - wg
        - mu
        - mw
        - rw
        - ws
        - p
        - e
        - l
        - q
        - d
        - s
        - c
        - sb
        - id
        - js
      ignore-type-assert-ok: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
  exclusions:
    generated: lax
    rules:
      - path: (errors|htmx_embed|notify|app|logging|csrf_middleware)\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
      - path: _test\.go
        text: dot-imports
        linters:
          - revive
      - path: app_test\.go$
        linters:
          - gochecknoglobals
      - path: webauthn_stub_test\.go$
        linters:
          - gochecknoglobals
      - path: _test\.go
        linters:
          - wrapcheck
      - path: (benchmark|example|_test|sse_reconnect_integration)_test?\.go$|^example.*_test\.go$|_test\.go$
        linters:
          - intrange
          - noctx
          - nilnil
          - goconst
          - funlen
          - paralleltest
          - err113
          - varnamelen
          - ireturn
      - path: _test\.go
        text: unused
        linters:
          - unused
      - path: _test\.go
        linters:
          - testpackage
      - path: benchmark_server_test\.go$
        linters:
          - exhaustruct
          - errcheck
      - path: _reexport\.go$
        linters:
          - gochecknoglobals
          - revive
      - path: core_bridge\.go$
        linters:
          - wrapcheck
          - revive
      - path: core/
        linters:
          - wrapcheck
      # HTMX headers (HX-Redirect, HX-Trigger-Name, ...) and the CSRF header
      # (X-CSRF-Token) use ecosystem-standard casing, not Go's canonical form.
      # http.Header.Set/Get canonicalize at the wire level regardless.
      - text: 'non-canonical header "HX-'
        linters:
          - canonicalheader
      - text: 'non-canonical header "X-CSRF-Token"'
        linters:
          - canonicalheader
      - path: dashboardui/pagination\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
    paths:
      - \.gen\.go$
      - _mock\.go$
      - _templ\.go$
      - adminui/
      - loginpage/
      - usermgmt/
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _mock\.go$
      - _templ\.go$
      - adminui/
      - usermgmt/
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
