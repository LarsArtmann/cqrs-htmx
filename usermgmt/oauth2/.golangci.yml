version: "2"
run:
  timeout: 5m
  go: 1.26.4
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gochecknoglobals
    - gochecknoinits
    - gosec
    - govet
    - ineffassign
    - nilerr
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wrapcheck
  disable:
    - exhaustruct
    - cyclop
    - dupl
    - funlen
    - gocognit
    - gocyclo
    - goconst
    - gocritic
    - interfacebloat
    - maintidx
    - nestif
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - errchkjson
          - wrapcheck
          - gosec
          - noctx
          - paralleltest
          - goconst
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - vendor/
formatters:
  enable:
    - gofumpt
    - goimports
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
