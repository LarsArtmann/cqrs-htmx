version: "2"
run:
  timeout: 5m
  go: 1.26.4
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - cyclop
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - gosmopolitan
    - govet
    - ineffassign
    - interfacebloat
    - intrange
    - loggercheck
    - maintidx
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
    - wrapcheck
    - zerologlint
  settings:
    cyclop:
      max-complexity: 12
    exhaustruct:
      exclude:
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.EnforcerConfig$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.HandlerConfig$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.ServiceConfig$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.PolicyUpdate$
        - .+\.\w+Payload$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.RegisterRequest$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.User$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.AccountLockout$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.ActorID$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.InMemorySessionStore$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.WebAuthnCredential$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.UserState$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.UserReadModel$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.CasbinProjection$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.EventSourcedSetup$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.UserRegisteredPayload$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.RolesUpdatedPayload$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.UserRegisteredEvent$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.RolesUpdatedEvent$
        - github\.com/pquerna/otp/totp\.GenerateOpts$
        - github\.com/pquerna/otp/totp\.ValidateOpts$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.\w+View$
        - github\.com/larsartmann/cqrs-htmx/usermgmt/v4\.SQL\w+ReadModel$
        - github\.com/larsartmann/go-cqrs-lite/kv/v4\.ViewQuery$
        - github\.com/larsartmann/go-cqrs-lite/kv/v4\.Condition$
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
  exclusions:
    generated: lax
    rules:
      - path: errors\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
      - path: webauthn_stub_test\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
      - path: es_constants\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
      - path: es_upcaster\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
      - path: id\.go$
        linters:
          - recvcheck
      - path: es_(state|readmodel|casbin_projection|setup|dispatch|upcaster)\.go$
        linters:
          - cyclop
      - path: es_(state|readmodel|casbin_projection|setup|dispatch|events|commands|upcaster)\.go$
        linters:
          - funlen
      - path: (http|verification_totp_http)\.go$
        linters:
          - contextcheck
      - path: service_core\.go$
        linters:
          - cyclop
      - path: service_core\.go$
        linters:
          - funlen
      - path: _test\.go
        linters:
          - wrapcheck
      - path: _test\.go
        linters:
          - exhaustruct
      - path: _test\.go
        linters:
          - goconst
      - path: _test\.go
        linters:
          - paralleltest
      - path: _test\.go
        linters:
          - unparam
      - path: _test\.go
        linters:
          - cyclop
      - path: _test\.go
        linters:
          - funlen
      - path: _test\.go
        text: G124
        linters:
          - gosec
      - path: _test\.go
        text: G104
        linters:
          - gosec
      - path: _test\.go
        text: G101
        linters:
          - gosec
      - path: _test\.go
        linters:
          - noctx
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - \.gen\.go$
      - _mock\.go$
      - _templ\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _mock\.go$
      - _templ\.go$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
