version: "2"
run:
  timeout: 5m
  go: 1.27.2
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - cyclop
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - gosmopolitan
    - govet
    - ineffassign
    - interfacebloat
    - intrange
    - loggercheck
    - maintidx
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
    - wrapcheck
    - zerologlint
  settings:
    wrapcheck:
      ignore-sigs:
        - .WithCause(
        - .WithContext(
        - .WithContextAny(
      ignore-package-globs:
        - github.com/larsartmann/go-error-family*
        - github.com/larsartmann/go-cqrs-lite/event/*
        - github.com/larsartmann/cqrs-htmx/legalparty-model*
    cyclop:
      max-complexity: 12
    exhaustruct:
      exclude:
        - github\.com/larsartmann/cqrs-htmx/legalparty-model/v4\.\w+Payload$
        - github\.com/larsartmann/cqrs-htmx/legalparty-model/v4\.LegalPartyState$
        - github\.com/larsartmann/cqrs-htmx/legalparty-model/v4\.LegalPartyProfile$
        - github\.com/larsartmann/cqrs-htmx/legalparty-model/v4\.RegisteredAddress$
        - github\.com/larsartmann/cqrs-htmx/legalparty-model/v4\.RegistryFacts$
        - github\.com/larsartmann/cqrs-htmx/legalparty-model/v4\.RegisterRef$
        - github\.com/larsartmann/cqrs-htmx/legalparty-model/v4\.LegalPartyID$
        # Registry adapters decode external JSON:API envelopes where absent
        # fields legitimately decode to zero values.
        - github\.com/larsartmann/cqrs-htmx/legalparty-model/v4/gleif\.\w+$
        - github\.com/larsartmann/cqrs-htmx/legalparty-model/v4/opencorporates\.\w+$
        # Optional-field clients construct the stdlib client with defaults.
        - net/http\.Client$
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
  exclusions:
    generated: lax
    rules:
      - path: errors\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
      - path: constants\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
      # aliases.go is the module's deliberate, baseline-frozen re-export of the
      # go-legalparty vocabulary (scripts/checks/reexport-baseline.tsv lists it
      # as exempt:domain-vocabulary): its Parse*/New* function values must stay
      # package-level so callers keep `legalparty.ParseLEI(...)`. Scope: this
      # file, this linter — mirroring the root config's _reexport.go rule.
      - path: aliases\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
      - path: country\.go$
        text: is a global variable
        linters:
          - gochecknoglobals
      - path: ids\.go$
        linters:
          - recvcheck
      - path: fold\.go$
        linters:
          - cyclop
          - funlen
          - gocognit
      - path: _test\.go
        linters:
          - wrapcheck
          - exhaustruct
          - goconst
          - gochecknoglobals
          - paralleltest
          - unparam
          - cyclop
          - funlen
          - noctx
    paths:
      - \.gen\.go$
      - _mock\.go$
      - _templ\.go$
