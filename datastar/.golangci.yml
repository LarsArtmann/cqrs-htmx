version: "2"
run:
  timeout: 5m
  go: 1.26.4
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - bodyclose
    - copyloopvar
    - cyclop
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - gosmopolitan
    - govet
    - ineffassign
    - interfacebloat
    - intrange
    - loggercheck
    - maintidx
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
    - wrapcheck
    - zerologlint
  disable:
    # Adapter module re-exports SDK functions as package-level vars — gochecknoglobals
    # would flag every re-export, defeating the single-import convenience purpose.
    - gochecknoglobals
    # exhaustruct flags unkeyed struct literals; the Patch types use internal fields.
    - exhaustruct
    # Adapter module re-exports SDK functions — wrapcheck flags every SDK
    # passthrough. The adapter is intentionally thin; wrapping adds noise.
    - wrapcheck
    # depguard denies encoding/json/v2 — the SDK uses encoding/json internally.
    - depguard
    # templ render chains confuse contextcheck.
    - contextcheck
    # gochecknoinits is disabled — no init functions exist but keeping parity with
    # other modules that may add them.
    - gochecknoinits
  settings:
    cyclop:
      max-complexity: 12
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
    testifylint:
      disable:
        - go-require
      enable-all: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - wrapcheck
      - path: _test\.go
        linters:
          - goconst
      - path: _test\.go
        linters:
          - paralleltest
      - path: _test\.go
        linters:
          - unparam
      - path: _test\.go
        linters:
          - cyclop
      - path: _test\.go
        linters:
          - funlen
      - path: _test\.go
        linters:
          - noctx
      - path: _test\.go
        linters:
          - errchkjson
      - path: _test\.go
        linters:
          - nilnil
      - path: _test\.go
        linters:
          - errcheck
    paths:
      - \.gen\.go$
      - _mock\.go$
      - _templ\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _mock\.go$
      - _templ\.go$
      - vendor/
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
