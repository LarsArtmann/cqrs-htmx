version: "2"
run:
  timeout: 5m
  go: 1.26.2
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  exclusions:
    rules:
      - linters:
          - gochecknoglobals
        path: "_test\\.go"
      - linters:
          - exhaustruct
        path: "_test\\.go"
      - linters:
          - paralleltest
        path: "_test\\.go"
      - linters:
          - noctx
        path: "_test\\.go"
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
