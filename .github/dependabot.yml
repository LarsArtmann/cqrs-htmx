# Posture (reviewed 2026-09-20, TODO_LIST hygiene micro-pack):
# - Only root, usermgmt, and integration_test are covered ON PURPOSE. The
#   larsartmann/* family dependencies ride coordinated release trains
#   (check-release-train gate), so dependabot's job here is the third-party
#   surface (casbin, templ, ginkgo, ...), which these three modules watch.
#   The other 24 modules share those deps via the train process; adding them
#   would duplicate every bump as 24 PRs.
# - EXPECTED BUILDFLOW INFO FINDING (accepted 2026-10-07, do not "fix"):
#   dependabot-auto-configure reports "28 Go modules; generation capped at 20
#   entries (root only)" — its generation cap would create ~20 near-duplicate
#   entries; this curated config is the deliberate override (rationale above).
#   Severity is info; the findings gate is fail_on: critical.
# - Grouping everywhere (round-12: usermgmt + integration_test join root's
#   minor-and-patch group; github-actions bumps batch into one PR via the
#   wildcard group). Automerge for actions is deliberately NOT enabled: this
#   repo pins action SHAs; a grouped, human-reviewed PR preserves that gate
#   while still preventing solo-bump reds from interleaving with trains.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
  - package-ecosystem: gomod
    directory: /usermgmt
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
  - package-ecosystem: gomod
    directory: /integration_test
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
    labels:
      - ci
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
