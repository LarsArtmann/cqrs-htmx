name: CI

on:
  push:
    branches: [master, v4]
  pull_request:
    branches: [master, v4]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # systemadapter + examples/system-demo replace
      # go-cqrs-lite/metaengine/projectionadapter/v4 with the sibling master
      # (unpublished v4.5.0 API; removal condition in AGENTS.md). The replace
      # targets ../../go-cqrs-lite, which exists on dev machines only — clone
      # it so this job builds the same content the local gates verify.
      # REMOVE this step when the projectionadapter replace strips.
      - name: Clone go-cqrs-lite sibling (replace target)
        run: git clone --depth 1 https://github.com/LarsArtmann/go-cqrs-lite.git "${GITHUB_WORKSPACE}/../go-cqrs-lite"

      - name: Build root module
        run: go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build usermgmt submodule
        run: cd usermgmt && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build usermgmt/totp submodule
        run: cd usermgmt/totp && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build usermgmt/webauthn submodule
        run: cd usermgmt/webauthn && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build usermgmt/oauth2 submodule
        run: cd usermgmt/oauth2 && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build adminui submodule
        run: cd adminui && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build integration_test submodule
        run: cd integration_test && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build datastar-demo example
        run: cd examples/datastar-demo && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2

      - name: Build admin-demo example
        run: cd examples/admin-demo && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build basic example
        run: cd examples/basic && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build catalog-demo example
        run: cd examples/catalog-demo && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2

      - name: Build async-startup-demo example
        run: cd examples/async-startup-demo && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build identity-model submodule
        run: cd identity-model && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build dashboardui submodule
        run: cd dashboardui && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build loginpage submodule
        run: cd loginpage && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build datastar submodule
        run: cd datastar && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2

      - name: Build middleware-demo example
        run: cd examples/middleware-demo && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build observability-demo example
        run: cd examples/observability-demo && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build dashboard-demo example
        run: cd examples/dashboard-demo && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build setup submodule
        run: cd setup && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build systemadapter submodule
        run: cd systemadapter && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build health submodule
        run: cd health && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build auditlog submodule
        run: cd auditlog && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # systemadapter + examples/system-demo replace
      # go-cqrs-lite/metaengine/projectionadapter/v4 with the sibling master
      # (unpublished v4.5.0 API; removal condition in AGENTS.md). The replace
      # targets ../../go-cqrs-lite, which exists on dev machines only — clone
      # it so this job builds the same content the local gates verify.
      # REMOVE this step when the projectionadapter replace strips.
      - name: Clone go-cqrs-lite sibling (replace target)
        run: git clone --depth 1 https://github.com/LarsArtmann/go-cqrs-lite.git "${GITHUB_WORKSPACE}/../go-cqrs-lite"

      - name: Test root module
        run: go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test usermgmt submodule
        run: cd usermgmt && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test usermgmt/totp submodule
        run: cd usermgmt/totp && go test ./... -count=1 -race
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test usermgmt/webauthn submodule
        run: cd usermgmt/webauthn && go test ./... -count=1 -race
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test usermgmt/oauth2 submodule
        run: cd usermgmt/oauth2 && go test ./... -count=1 -race
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test adminui submodule
        run: cd adminui && go test ./... -count=1 -race
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test integration_test submodule
        run: cd integration_test && go test ./... -count=1 -race
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test identity-model submodule
        run: cd identity-model && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test dashboardui submodule
        run: cd dashboardui && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test loginpage submodule
        run: cd loginpage && go test ./... -count=1 -race
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test datastar submodule
        run: cd datastar && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test setup submodule
        run: cd setup && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test systemadapter submodule
        run: cd systemadapter && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test health submodule
        run: cd health && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test auditlog submodule
        run: cd auditlog && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Coverage check
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Root coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 90) { print \"Root coverage ${COVERAGE}% is below 90% threshold\"; exit 1 } }"

      - name: Usermgmt coverage check
        run: |
          cd usermgmt
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Usermgmt coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 74) { print \"Usermgmt coverage ${COVERAGE}% is below 74% threshold\"; exit 1 } }"
        env:
          GOWORK: off

      - name: identity-model coverage check
        run: |
          cd identity-model
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "identity-model coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 70) { print \"identity-model coverage ${COVERAGE}% is below 70% threshold\"; exit 1 } }"
        env:
          GOWORK: off

      - name: dashboardui coverage check
        run: |
          cd dashboardui
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "dashboardui coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 60) { print \"dashboardui coverage ${COVERAGE}% is below 60% threshold\"; exit 1 } }"
        env:
          GOWORK: off

      - name: dashboardui/core coverage check
        run: |
          cd dashboardui && go test ./core/... -count=1 -coverprofile=core-coverage.out
          COVERAGE=$(go tool cover -func=core-coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "dashboardui/core coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 80) { print \"dashboardui/core coverage ${COVERAGE}% is below 80% threshold\"; exit 1 } }"
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: datastar coverage check
        run: |
          cd datastar
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "datastar coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 90) { print \"datastar coverage ${COVERAGE}% is below 90% threshold\"; exit 1 } }"
        env:
          GOWORK: off

      - name: setup coverage check
        run: |
          cd setup
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "setup coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 80) { print \"setup coverage ${COVERAGE}% is below 80% threshold\"; exit 1 } }"
        env:
          GOWORK: off

      - name: systemadapter coverage check
        run: |
          cd systemadapter
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "systemadapter coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 70) { print \"systemadapter coverage ${COVERAGE}% is below 70% threshold\"; exit 1 } }"
        env:
          GOWORK: off

      - name: health coverage check
        run: |
          cd health
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "health coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 90) { print \"health coverage ${COVERAGE}% is below 90% threshold\"; exit 1 } }"
        env:
          GOWORK: off

      - name: auditlog coverage check
        run: |
          cd auditlog
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "auditlog coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 90) { print \"auditlog coverage ${COVERAGE}% is below 90% threshold\"; exit 1 } }"
        env:
          GOWORK: off

  lint:
    runs-on: ubuntu-latest
    # Matrix with fail-fast:false so one red module surfaces ALL red modules
    # in one run (the sequential form hid every failure after the first —
    # the gotcha-27c "CI only surfaces the first failure per job" class).
    strategy:
      fail-fast: false
      matrix:
        module: [".", "usermgmt", "adminui", "identity-model", "dashboardui", "loginpage", "datastar", "setup", "systemadapter", "health", "auditlog"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # systemadapter + examples/system-demo replace
      # go-cqrs-lite/metaengine/projectionadapter/v4 with the sibling master
      # (unpublished v4.5.0 API; removal condition in AGENTS.md). The replace
      # targets ../../go-cqrs-lite, which exists on dev machines only — clone
      # it so this job builds the same content the local gates verify.
      # REMOVE this step when the projectionadapter replace strips.
      - name: Clone go-cqrs-lite sibling (replace target)
        run: git clone --depth 1 https://github.com/LarsArtmann/go-cqrs-lite.git "${GITHUB_WORKSPACE}/../go-cqrs-lite"

      - name: golangci-lint (${{ matrix.module }})
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}
          args: "--timeout=5m"
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

  mod-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # systemadapter + examples/system-demo replace
      # go-cqrs-lite/metaengine/projectionadapter/v4 with the sibling master
      # (unpublished v4.5.0 API; removal condition in AGENTS.md). The replace
      # targets ../../go-cqrs-lite, which exists on dev machines only — clone
      # it so this job builds the same content the local gates verify.
      # REMOVE this step when the projectionadapter replace strips.
      - name: Clone go-cqrs-lite sibling (replace target)
        run: git clone --depth 1 https://github.com/LarsArtmann/go-cqrs-lite.git "${GITHUB_WORKSPACE}/../go-cqrs-lite"

      - name: Verify go mod tidy (all modules)
        run: |
          for mod in . identity-model usermgmt usermgmt/totp usermgmt/webauthn usermgmt/oauth2 adminui loginpage dashboardui setup systemadapter health auditlog integration_test examples/basic examples/admin-demo examples/catalog-demo examples/datastar-demo examples/middleware-demo examples/observability-demo examples/dashboard-demo; do
            echo "=== Checking $mod ==="
            (cd "$mod" && go mod tidy -diff)
          done
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      # go.work.sum regenerates on demand in the workspace and must stay
      # untracked (it was absorbed into unrelated commits while indexed).
      - name: go.work.sum stays untracked
        run: |
          if git ls-files --error-unmatch go.work.sum >/dev/null 2>&1; then
            echo "FAIL: go.work.sum is tracked — untrack it: git rm --cached go.work.sum"
            exit 1
          fi
          echo "OK: go.work.sum untracked."

  module-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # systemadapter + examples/system-demo replace
      # go-cqrs-lite/metaengine/projectionadapter/v4 with the sibling master
      # (unpublished v4.5.0 API; removal condition in AGENTS.md). The replace
      # targets ../../go-cqrs-lite, which exists on dev machines only — clone
      # it so this job builds the same content the local gates verify.
      # REMOVE this step when the projectionadapter replace strips.
      - name: Clone go-cqrs-lite sibling (replace target)
        run: git clone --depth 1 https://github.com/LarsArtmann/go-cqrs-lite.git "${GITHUB_WORKSPACE}/../go-cqrs-lite"

      - name: Module isolation check (GOWORK=off build+vet)
        run: bash scripts/checks/check-module-isolation.sh
        env:
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Dependency budget check
        run: bash scripts/checks/check-dep-budgets.sh

      # Fixture self-test pinning the dep-counting awk (standalone comment
      # lines + // indirect must NOT count — the 2026-09-22 regression class).
      - name: Dependency budget self-test
        run: bash scripts/selftests/test-check-dep-budgets.sh

      - name: Go toolchain vs go.work directive check
        run: bash scripts/checks/check-go-toolchain.sh

      # Workspace-mode build in every go.work member — the complement to the
      # hermetic per-module gates. go.work use/replace mangling (the 373209a7
      # ambiguous-import class) only assembles the union module graph in
      # workspace mode, where GOWORK=off gates are blind.
      - name: Workspace build check
        run: bash scripts/checks/check-workspace-build.sh
        env:
          GOEXPERIMENT: jsonv2

      - name: Workspace build self-test
        run: bash scripts/selftests/test-check-workspace-build.sh
        env:
          GOEXPERIMENT: jsonv2

      # Offline fixture self-test for the erraudit inventory sweep (stubbed
      # binary — no erraudit install needed on runners): pins the candidate
      # count + fail-on-zero false-green guard for the go.work decomposition.
      - name: Erraudit inventory self-test
        run: bash scripts/selftests/test-erraudit-inventory.sh

      # BLOCKING since 2026-09-09 (was `|| true` advisory): an UNPUBLISHED
      # internal require (phantom-tag class) or train lag beyond the budget
      # fails the build. --strict-lag 0 went live after the 2026-09-09
      # alignment sweep zeroed the lag; raise the budget only deliberately
      # (mid-sweep), never leave it loose. ls-remote failures self-downgrade
      # to warnings when CI=true (exit 4), so a runner network blip cannot
      # spuriously red-master. Public repos confirmed 2026-08-31.
      - name: Release train check (blocking)
        run: bash scripts/checks/check-release-train.sh --strict-lag 0

      - name: Release train self-test
        run: bash scripts/selftests/test-check-release-train.sh

      # GOPRIVATE VCS-cache health (local-machine corruption class: a bare
      # repo under GOMODCACHE/cache/vcs losing its origin breaks hermetic
      # builds with load-error-shaped failures). CI runners resolve via the
      # proxy and have no VCS entries — this passes trivially there and
      # catches nothing, but keeps CI wired to the same gate the fleet runs
      # (atomic-gates rule). The fixture self-test is the real coverage.
      - name: VCS cache health check
        run: bash scripts/checks/check-vcs-cache.sh

      - name: VCS cache health self-test
        run: bash scripts/selftests/test-check-vcs-cache.sh

      # Committed Tailwind bundles must be the canonical minified builder
      # output (catches the buildflow hook's non-minified rewrite and the
      # 2026-09-22 near-empty staged-bundle incident class).
      - name: CSS bundle sanity check
        run: bash scripts/checks/check-css-bundles.sh

      - name: CSS bundle sanity self-test
        run: bash scripts/selftests/test-check-css-bundles.sh

      # Exact-class-set drift gate: the committed bundles' sorted class
      # tokens must equal a fresh canonical build's (mechanizes the
      # formatting-only proof family bumps need; 2026-09-26). The runner
      # has no nix, so the comparison self-skips there — the fixture
      # self-test below is the coverage; the real check runs locally via
      # nix run .#check-css-bundle-classes and in check-modules.
      - name: CSS bundle class-set drift check
        run: bash scripts/checks/check-css-bundle-classes.sh

      - name: CSS bundle class-set self-test
        run: bash scripts/selftests/test-check-css-bundle-classes.sh

      # ADR-0055 invariant: every /auth/* route whose handler reads the
      # session context must be registered behind h.withSession — a bare
      # context-only mount is a dead route, an ungated ceremony is a
      # takeover hole. Transitive handler-body scan + fixture self-test.
      - name: Session route wrapper invariant check
        run: bash scripts/checks/check-session-route-wrappers.sh

      - name: Session route wrapper self-test
        run: bash scripts/selftests/test-check-session-route-wrappers.sh

      # Gotcha-25/D12 invariant: StreamID().String() is display-form
      # (StreamMarker-branded under the in-flight id train), never identity.
      # Pinned display allowlist; identity positions use .Get().
      - name: StreamID identity-form check
        run: bash scripts/checks/check-streamid-identity.sh

      - name: StreamID identity-form self-test
        run: bash scripts/selftests/test-check-streamid-identity.sh

      # R2/R18: upstream release consumability — a tag whose go.mod carries
      # placeholder pseudo-version requires (templ-components v1.20.0 class)
      # blocks every consumer push with a misleading "unknown revision".
      # Offline fixture self-test; the live checker runs at bump time
      # (bump-dep pre-flight).
      - name: Family release consumable self-test
        run: bash scripts/selftests/test-check-family-release-consumable.sh

      # Gotcha-27c mechanized: self-tests of CI-branching checkers must strip
      # CI (env -u CI) or they cover the wrong branch on GitHub runners.
      - name: Self-test env-leak audit
        run: bash scripts/checks/check-selftest-env-leaks.sh

      - name: Self-test env-leak audit self-test
        run: bash scripts/selftests/test-check-selftest-env-leaks.sh

      # branching-flow (go-design-smells) ratchet: fails only on NEW findings
      # vs the committed SARIF baseline (docs/analysis/). Runners have no
      # branching-flow binary — the check self-skips under CI=true and the
      # fixture self-test below is the coverage; the real gate runs locally
      # via nix run .#check-branching-flow and in check-modules.
      - name: Branching-flow ratchet check
        run: bash scripts/checks/check-branching-flow.sh
        env:
          GOEXPERIMENT: jsonv2

      - name: Branching-flow ratchet self-test
        run: bash scripts/selftests/test-check-branching-flow.sh

      # Concurrency-safety helpers for the shared tree (auto-commit daemon +
      # concurrent sessions, gotcha 4). The self-tests are the coverage; the
      # helpers themselves are session tools, not repo-state checks.
      - name: Preflight tree-check self-test
        run: bash scripts/selftests/test-preflight-tree-check.sh

      - name: Wait-tree-quiet self-test
        run: bash scripts/selftests/test-wait-tree-quiet.sh

      # Train-preflight (T02, 2026-10-08): one command before a train —
      # quiescence + surprise + lint + hermetic tests + strict train gate,
      # with gotcha-2 candidate-count guards. Runners cannot execute the
      # real stages here; the stub self-test is the coverage and the real
      # app is the documented pre-train step (release playbook).
      - name: Train-preflight self-test
        run: bash scripts/selftests/test-train-preflight.sh

      # Hermetic consumer catch (T04, 2026-10-08; gotcha-30 mechanized): the
      # stub self-test is the CI coverage; the real gate runs locally via
      # `nix run .#check-train-consumers-hermetic` before verify-tag --push
      # (release checklist + playbook §1).
      - name: Train-consumers-hermetic self-test
        run: bash scripts/selftests/test-check-train-consumers-hermetic.sh

      # BLOCKING since 2026-09-09 (was `|| true` advisory): version drift or
      # a missing internal tag fails the build via --strict. Tag existence
      # uses anonymous `git ls-remote`; the larsartmann repos are public
      # (confirmed 2026-08-30), so the old "CI may lack auth" caveat no
      # longer applies.
      - name: Version drift check (blocking)
        run: bash scripts/checks/check-version-drift.sh --strict

      - name: Replace directive check
        run: bash scripts/checks/check-replace-directives.sh

  checks:
    runs-on: ubuntu-latest
    # bench-spike is deliberately LOCAL-only (`nix run .#bench-spike`): the
    # raw baseline is machine-pinned and CI runners are a different machine
    # population. Rationale + re-pin flow: docs/benchmarks/README.md.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Binary / large-file guard
        run: bash scripts/checks/check-large-files.sh --all

      - name: "*Service method count guard (ADR-0038)"
        run: bash scripts/checks/check-service-methods.sh

      - name: Domain model count drift check
        run: bash scripts/checks/check-domain-counts.sh

      # Shell scripts are load-bearing gates now (verify-tag, train check,
      # isolation...). Lint them in CI; treefmt owns local formatting.
      - name: Shellcheck gate scripts
        run: |
          # Paths must be container-relative (/mnt is the docker volume below);
          # the previous `find /mnt/scripts` silently found nothing on CI
          # runners (no /mnt mount there) and shellcheck exited 3 on an empty
          # file list.
          mapfile -t files < <(cd scripts && find . -name '*.sh' | sort | sed 's|^\./|/mnt/scripts/|')
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable "${files[@]}"

      - name: Actionlint workflow
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

      # Offline fixture self-tests for the release tag protocol + the
      # pre-commit hook installer (git only, no network, no signing keys).
      - name: verify-tag fixture self-test
        run: bash scripts/selftests/test-verify-tag.sh

      - name: install-git-hooks self-test
        run: bash scripts/selftests/test-install-git-hooks.sh

      # Presence gate for archived status-report annotations (inline
      # strikethrough + dated blockquote since the 2026-09-09 epoch; older
      # reports are LEGACY-EXEMPT) plus its fixture self-test.
      - name: Status annotation gate
        run: bash scripts/checks/check-status-annotations.sh

      - name: Status annotation gate self-test
        run: bash scripts/selftests/test-check-status-annotations.sh

      # Row-integrity gate for annotated status reports (PARTIAL rows fail;
      # deliberately-mixed tables are first-class) plus its fixture self-test.
      - name: Status row gate
        run: python3 scripts/checks/check-status-rows.py

      - name: Status row gate self-test
        run: bash scripts/selftests/test-check-status-rows.sh

      # Fixer-side companion to the row gate: proves the whole-row-strike
      # normalizer completes PARTIAL rows and that the checker then agrees
      # (the 2026-10-01 round-13 batch that normalized 72 rows by hand).
      - name: Status row normalize self-test
        run: bash scripts/selftests/test-normalize-status-rows.sh

      # Advisory tail-budget gate (non-blocking by design; a mid-session
      # docs/status tail is legitimate) plus its fixture self-test.
      - name: Docs status tail-budget self-test
        run: bash scripts/selftests/test-check-docs-tail-budget.sh

      # bump-dep.sh discovery self-test (block + single-line require forms,
      # $ anchor, testdata skip) — the 9b3c2e18 regex-gap regression guard.
      - name: bump-dep self-test
        run: bash scripts/selftests/test-bump-dep.sh

      # Fixture self-test for the /v4-suffix import-path rule inside
      # check-docs-freshness.sh (scripts/lib/docs-import-paths.sh).
      - name: Docs freshness self-test
        run: bash scripts/selftests/test-check-docs-freshness.sh

      # The checker itself (was self-test-only — a CI parity gap found in
      # the 2026-09-26 wiring sweep; the gate is offline-capable).
      - name: Docs freshness check
        run: bash scripts/checks/check-docs-freshness.sh

      - name: Markdown link check
        run: bash scripts/checks/check-docs-links.sh

      - name: Codegen drift check (_templ.go)
        env:
          GOEXPERIMENT: jsonv2
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          for mod in adminui loginpage dashboardui; do
            echo "==> $mod"
            (cd "$mod" && templ generate && gofmt -w ./*_templ.go)
            if ! git diff --exit-code -- "$mod"/*_templ.go; then
              echo ""
              echo "FAIL: Generated _templ.go files in $mod differ from committed versions."
              echo "Run 'templ generate' in $mod/ and commit the result."
              exit 1
            fi
          done
          echo "Codegen drift check PASSED"

      - name: SQL setup template compile check
        run: |
          bash scripts/checks/check-templates.sh
          if ! git diff --exit-code -- usermgmt/; then
            echo ""
            echo "FAIL: check-templates.sh left usermgmt/ modified."
            echo "Either the trap-based restore leaked, or usermgmt/go.mod (go.sum)"
            echo "is not tidy for the stack-backend requires the script adds."
            echo "Run the script locally and commit any resulting go.mod/go.sum changes."
            exit 1
          fi
        env:
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Canonical zero-pseudo scan (scripts/checks/check-require-tags.sh) replaces
      # the former inline grep copy in this job.
      - name: Require tags check (zero-pseudo)
        run: bash scripts/checks/check-require-tags.sh

      - name: Error family check
        run: |
          echo "=== Error Family Check ==="
          go run scripts/checks/errorfamily_scanner.go . usermgmt adminui identity-model dashboardui loginpage datastar setup
          echo "OK: All modules pass errorfamily check."
        env:
          GOEXPERIMENT: jsonv2

      - name: gosec
        uses: securego/gosec@8c77519419e934a3e158dbf1a3fbbc0871b8c691 # master
        with:
          args: "-no-fail -fmt sarif -out results.sarif ./..."
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: results.sarif
