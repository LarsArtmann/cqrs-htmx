  mod-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Verify go mod tidy (all modules)
        run: |
          for mod in . identity-model usermgmt usermgmt/totp usermgmt/webauthn usermgmt/oauth2 adminui loginpage dashboardui setup systemadapter health auditlog integration_test examples/basic examples/admin-demo examples/catalog-demo examples/datastar-demo examples/middleware-demo examples/observability-demo examples/dashboard-demo; do
            echo "=== Checking $mod ==="
            (cd "$mod" && go mod tidy -diff)
          done
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

  module-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Module isolation check (GOWORK=off build+vet)
        run: bash scripts/check-module-isolation.sh
        env:
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Dependency budget check
        run: bash scripts/check-dep-budgets.sh

      - name: Go toolchain vs go.work directive check
        run: bash scripts/check-go-toolchain.sh

      # Advisory: the script needs `git ls-remote` auth for the larsartmann
      # repos, unverified on Actions runners so far (open question since
      # 2026-08-29); it also self-downgrades to WARN under CI when
      # ls-remote fails. Flip to blocking after a green week.
      - name: Release train check (advisory)
        run: bash scripts/check-release-train.sh || true

      # Advisory here: the tag-existence leg needs `git ls-remote` auth for the
      # private larsartmann repos over https, which CI may not have. The strict
      # gate runs in `nix run .#check-modules` locally.
      - name: Version drift check (advisory)
        run: bash scripts/check-version-drift.sh || true

      - name: Replace directive check
        run: bash scripts/check-replace-directives.sh

  checks:
    runs-on: ubuntu-latest
    # bench-spike is deliberately LOCAL-only (`nix run .#bench-spike`): the
    # raw baseline is machine-pinned and CI runners are a different machine
    # population. Rationale + re-pin flow: docs/benchmarks/README.md.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Binary / large-file guard
        run: bash scripts/check-large-files.sh --all

      - name: "*Service method count guard (ADR-0038)"
        run: bash scripts/check-service-methods.sh

      - name: Domain model count drift check
        run: bash scripts/check-domain-counts.sh

      - name: Markdown link check
        run: bash scripts/check-docs-links.sh

      - name: Codegen drift check (_templ.go)
        env:
          GOEXPERIMENT: jsonv2
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          for mod in adminui loginpage; do
            echo "==> $mod"
            (cd "$mod" && templ generate && gofmt -w ./*_templ.go)
            if ! git diff --exit-code -- "$mod"/*_templ.go; then
              echo ""
              echo "FAIL: Generated _templ.go files in $mod differ from committed versions."
              echo "Run 'templ generate' in $mod/ and commit the result."
              exit 1
            fi
          done
          echo "Codegen drift check PASSED"

      - name: SQL setup template compile check
        run: |
          bash scripts/check-templates.sh
          if ! git diff --exit-code -- usermgmt/; then
            echo ""
            echo "FAIL: check-templates.sh left usermgmt/ modified."
            echo "Either the trap-based restore leaked, or usermgmt/go.mod (go.sum)"
            echo "is not tidy for the stack-backend requires the script adds."
            echo "Run the script locally and commit any resulting go.mod/go.sum changes."
            exit 1
          fi
        env:
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Phantom version check
        run: |
          echo "=== Phantom Version Check ==="
          if grep -rF 'v0.0.0-00010101000000-000000000000' --include='go.mod' .; then
            echo "FAIL: zero pseudo-version detected in go.mod"
            exit 1
          fi
          echo "OK: No phantom versions detected."

      - name: Error family check
        run: |
          echo "=== Error Family Check ==="
          go run scripts/errorfamily_scanner.go . usermgmt adminui identity-model dashboardui loginpage datastar setup
          echo "OK: All modules pass errorfamily check."
        env:
          GOEXPERIMENT: jsonv2

      - name: gosec
        uses: securego/gosec@2eb4727ebc7504944ddbcdd2f7157db492026c3f # master
        with:
          args: "-no-fail -fmt sarif -out results.sarif ./..."
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always()
        with:
          sarif_file: results.sarif
