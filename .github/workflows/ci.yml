name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build root module
        run: go build ./...
        env:
          GOWORK: off
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build usermgmt submodule
        run: cd usermgmt && go build ./...
        env:
          GOWORK: off
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build integration_test submodule
        run: cd integration_test && go build ./...
        env:
          GOWORK: off
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build datastar-demo example
        run: cd examples/datastar-demo && go build ./...
        env:
          GOWORK: off

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test root module
        run: go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test usermgmt submodule
        run: cd usermgmt && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test integration_test submodule
        run: cd integration_test && go test ./... -count=1 -race
        env:
          GOWORK: off
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Coverage check
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Root coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 95) { print \"Root coverage ${COVERAGE}% is below 95% threshold\"; exit 1 } }"

      - name: Usermgmt coverage check
        run: |
          COVERAGE=$(go tool cover -func=usermgmt/coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Usermgmt coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 90) { print \"Usermgmt coverage ${COVERAGE}% is below 90% threshold\"; exit 1 } }"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
        env:
          GOWORK: off

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gosec
        uses: securego/gosec@master
        with:
          args: "-no-fail -fmt sarif -out results.sarif ./..."
        env:
          GOWORK: off
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        env:
          GOWORK: off
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
