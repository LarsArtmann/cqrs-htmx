name: CI

on:
  push:
    branches: [master, v4]
  pull_request:
    branches: [master, v4]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build root module
        run: go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build usermgmt submodule
        run: cd usermgmt && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build usermgmt/totp submodule
        run: cd usermgmt/totp && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build usermgmt/webauthn submodule
        run: cd usermgmt/webauthn && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build usermgmt/oauth2 submodule
        run: cd usermgmt/oauth2 && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build adminui submodule
        run: cd adminui && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build integration_test submodule
        run: cd integration_test && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build datastar-demo example
        run: cd examples/datastar-demo && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2

      - name: Build admin-demo example
        run: cd examples/admin-demo && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build basic example
        run: cd examples/basic && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build catalog-demo example
        run: cd examples/catalog-demo && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2

      - name: Build identity-model submodule
        run: cd identity-model && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build dashboardui submodule
        run: cd dashboardui && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build loginpage submodule
        run: cd loginpage && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build datastar submodule
        run: cd datastar && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2

      - name: Build middleware-demo example
        run: cd examples/middleware-demo && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build observability-demo example
        run: cd examples/observability-demo && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build dashboard-demo example
        run: cd examples/dashboard-demo && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build setup submodule
        run: cd setup && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Build systemadapter submodule
        run: cd systemadapter && go build ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test root module
        run: go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test usermgmt submodule
        run: cd usermgmt && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test usermgmt/totp submodule
        run: cd usermgmt/totp && go test ./... -count=1 -race
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test usermgmt/webauthn submodule
        run: cd usermgmt/webauthn && go test ./... -count=1 -race
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test usermgmt/oauth2 submodule
        run: cd usermgmt/oauth2 && go test ./... -count=1 -race
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test adminui submodule
        run: cd adminui && go test ./... -count=1 -race
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test integration_test submodule
        run: cd integration_test && go test ./... -count=1 -race
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test identity-model submodule
        run: cd identity-model && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test dashboardui submodule
        run: cd dashboardui && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test loginpage submodule
        run: cd loginpage && go test ./... -count=1 -race
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test datastar submodule
        run: cd datastar && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test setup submodule
        run: cd setup && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Test systemadapter submodule
        run: cd systemadapter && go test ./... -count=1 -race -coverprofile=coverage.out
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Coverage check
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Root coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 90) { print \"Root coverage ${COVERAGE}% is below 90% threshold\"; exit 1 } }"

      - name: Usermgmt coverage check
        run: |
          COVERAGE=$(go tool cover -func=usermgmt/coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Usermgmt coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 74) { print \"Usermgmt coverage ${COVERAGE}% is below 74% threshold\"; exit 1 } }"

      - name: identity-model coverage check
        run: |
          COVERAGE=$(go tool cover -func=identity-model/coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "identity-model coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 70) { print \"identity-model coverage ${COVERAGE}% is below 70% threshold\"; exit 1 } }"

      - name: dashboardui coverage check
        run: |
          COVERAGE=$(go tool cover -func=dashboardui/coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "dashboardui coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 60) { print \"dashboardui coverage ${COVERAGE}% is below 60% threshold\"; exit 1 } }"

      - name: dashboardui/core coverage check
        run: |
          cd dashboardui && go test ./core/... -count=1 -coverprofile=core-coverage.out
          COVERAGE=$(go tool cover -func=core-coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "dashboardui/core coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 80) { print \"dashboardui/core coverage ${COVERAGE}% is below 80% threshold\"; exit 1 } }"
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: datastar coverage check
        run: |
          COVERAGE=$(go tool cover -func=datastar/coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "datastar coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 90) { print \"datastar coverage ${COVERAGE}% is below 90% threshold\"; exit 1 } }"

      - name: setup coverage check
        run: |
          COVERAGE=$(go tool cover -func=setup/coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "setup coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 80) { print \"setup coverage ${COVERAGE}% is below 80% threshold\"; exit 1 } }"

      - name: systemadapter coverage check
        run: |
          COVERAGE=$(go tool cover -func=systemadapter/coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "systemadapter coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 60) { print \"systemadapter coverage ${COVERAGE}% is below 60% threshold\"; exit 1 } }"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: "--timeout=5m"
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: golangci-lint (usermgmt)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: usermgmt
          args: "--timeout=5m"
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: golangci-lint (adminui)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: adminui
          args: "--timeout=5m"
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: golangci-lint (identity-model)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: identity-model
          args: "--timeout=5m"
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: golangci-lint (dashboardui)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: dashboardui
          args: "--timeout=5m"
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: golangci-lint (loginpage)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: loginpage
          args: "--timeout=5m"
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: golangci-lint (datastar)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: datastar
          args: "--timeout=5m"
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: golangci-lint (setup)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: setup
          args: "--timeout=5m"
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: golangci-lint (systemadapter)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: systemadapter
          args: "--timeout=5m"
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

  mod-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify go mod tidy (all modules)
        run: |
          for mod in . identity-model usermgmt usermgmt/totp usermgmt/webauthn usermgmt/oauth2 adminui loginpage dashboardui setup systemadapter integration_test examples/basic examples/admin-demo examples/catalog-demo examples/datastar-demo examples/middleware-demo examples/observability-demo examples/dashboard-demo; do
            echo "=== Checking $mod ==="
            (cd "$mod" && go mod tidy -diff)
          done
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

  module-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Module isolation check (GOWORK=off build+vet)
        run: bash scripts/check-module-isolation.sh
        env:
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Dependency budget check
        run: bash scripts/check-dep-budgets.sh

      - name: Version drift check (advisory)
        run: bash scripts/check-version-drift.sh || true

      - name: Replace directive check
        run: bash scripts/check-replace-directives.sh

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Binary / large-file guard
        run: bash scripts/check-large-files.sh --all

      - name: "*Service method count guard (ADR-0038)"
        run: bash scripts/check-service-methods.sh

      - name: Domain model count drift check
        run: bash scripts/check-domain-counts.sh

      - name: Markdown link check
        run: bash scripts/check-docs-links.sh

      - name: Codegen drift check (_templ.go)
        env:
          GOEXPERIMENT: jsonv2
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          for mod in adminui loginpage; do
            echo "==> $mod"
            (cd "$mod" && templ generate && gofmt -w ./*_templ.go)
            if ! git diff --exit-code -- "$mod"/*_templ.go; then
              echo ""
              echo "FAIL: Generated _templ.go files in $mod differ from committed versions."
              echo "Run 'templ generate' in $mod/ and commit the result."
              exit 1
            fi
          done
          echo "Codegen drift check PASSED"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Phantom version check
        run: |
          echo "=== Phantom Version Check ==="
          if grep -rF 'v0.0.0-00010101000000-000000000000' --include='go.mod' .; then
            echo "FAIL: zero pseudo-version detected in go.mod"
            exit 1
          fi
          echo "OK: No phantom versions detected."

      - name: Error family check
        run: |
          echo "=== Error Family Check ==="
          go run scripts/errorfamily_scanner.go . usermgmt adminui identity-model dashboardui loginpage datastar setup
          echo "OK: All modules pass errorfamily check."
        env:
          GOEXPERIMENT: jsonv2

      - name: gosec
        uses: securego/gosec@master
        with:
          args: "-no-fail -fmt sarif -out results.sarif ./..."
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        env:
          GOWORK: off
          GOEXPERIMENT: jsonv2
          GONOSUMCHECK: "github.com/larsartmann/*"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
